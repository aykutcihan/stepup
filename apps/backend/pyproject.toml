[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  ".ruff_cache",
  "alembic/versions",
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "UP",     # pyupgrade
  "T201",   # print statements
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # function call in default argument
  "B904",   # raise from e (for HTTPException)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
