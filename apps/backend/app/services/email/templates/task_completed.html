<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task completed — review required</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
          <tr>
            <td style="background:#1d4ed8;padding:28px 40px;">
              <p style="margin:0;color:#ffffff;font-size:22px;font-weight:bold;">StepUp</p>
            </td>
          </tr>
          <tr>
            <td style="padding:40px;">
              <h1 style="margin:0 0 16px;font-size:20px;color:#111827;">Task completed — review required</h1>
              <p style="margin:0 0 12px;font-size:15px;color:#374151;line-height:1.6;">Hi {{ manager_first_name }},</p>
              <p style="margin:0 0 12px;font-size:15px;color:#374151;line-height:1.6;">
                <strong>{{ employee_name }}</strong> has marked the following task as complete and it is awaiting your review:
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;margin:0 0 28px;">
                <tr>
                  <td style="padding:16px 20px;font-size:15px;color:#111827;font-weight:bold;">{{ task_title }}</td>
                </tr>
              </table>
              <a href="{{ approvals_url }}"
                 style="display:inline-block;background:#1d4ed8;color:#ffffff;font-size:15px;font-weight:bold;padding:12px 28px;border-radius:6px;text-decoration:none;">
                Go to Pending Approvals
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 40px;border-top:1px solid #e5e7eb;">
              <p style="margin:0;font-size:12px;color:#9ca3af;">© StepUp. This is an automated message, please do not reply.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
