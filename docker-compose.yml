version: "3.9"

services:
  db:
    image: postgres:15
    container_name: stepup-db
    environment:
      POSTGRES_USER: stepup
      POSTGRES_PASSWORD: stepup123
      POSTGRES_DB: stepup_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: stepup-backend
    environment:
      DATABASE_URL: postgresql://stepup:stepup123@db:5432/stepup_db
      SECRET_KEY: dev-secret-key-change-in-production
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: stepup-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: