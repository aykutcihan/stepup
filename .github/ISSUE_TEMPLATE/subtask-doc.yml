name: "Subtask — DOC"
description: "Documentation subtask (guide or ADR)"
title: "DOC: "
labels: ["documentation"]
body:
  - type: input
    id: parent_us
    attributes:
      label: "Parent US"
      placeholder: "US-001: Invite User with Role"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      placeholder: |
        - [ ] docs/guides/XX-topic.md updated
        - [ ] docs/adr/ADR-XXX-decision.md created
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria"
      placeholder: |
        - [ ] Document written and clear
        - [ ] Commands/examples tested
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: "Definition of Done"
      value: |
        - [ ] Document written
        - [ ] Added to PR
    validations:
      required: true
