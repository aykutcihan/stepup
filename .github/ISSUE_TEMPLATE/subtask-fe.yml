name: "Subtask — FE"
description: "Frontend subtask"
title: "FE: "
labels: ["frontend"]
body:
  - type: input
    id: parent_us
    attributes:
      label: "Parent US"
      placeholder: "US-001: Invite User with Role"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      placeholder: |
        - [ ] Component: ...
        - [ ] API connection: ...
        - [ ] Route: ...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria"
      placeholder: |
        - [ ] Component renders correctly
        - [ ] API connection works
        - [ ] Loading and error states handled
        - [ ] Responsive design
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: "Definition of Done"
      value: |
        - [ ] Code written
        - [ ] PR opened and reviewed
        - [ ] CI pipeline passes
        - [ ] Acceptance criteria met
    validations:
      required: true
