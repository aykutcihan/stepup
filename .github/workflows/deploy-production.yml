name: Deploy to Production (Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: stepup-494114
  REGION: europe-west4
  IMAGE: europe-west4-docker.pkg.dev/stepup-494114/cloud-run-source-deploy/stepup/stepup-backend
  SERVICE: stepup-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -f apps/backend/Dockerfile apps/backend
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Run database migrations
        run: |
          gcloud run jobs execute migration-job \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --wait
